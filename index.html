<script>
  const PROJECT_ID = "57495c44-ee23-4be7-ade2-b70b6b4c8416";
  const GRAPH_URL = "https://ai-agent-pilot-backend.onrender.com/run_graph";

  const chat = document.getElementById("chat");
  const form = document.getElementById("chat-form");
  const roleInput = document.getElementById("role");
  const messageInput = document.getElementById("message");
  const sendButton = document.getElementById("send-button");
  const status = document.getElementById("status");

  function addMessage(role, text, customLabel = null) {
    const box = document.createElement("article");
    box.className = `message ${role === "assistant" ? "assistant" : "user"}`;

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = customLabel || role;

    const content = document.createElement("div");
    content.textContent = text;

    box.append(label, content);
    chat.appendChild(box);
    chat.scrollTop = chat.scrollHeight;
  }

  addMessage(
    "assistant",
    "Choose a role, write a message, and press Send.",
    "AI Pilot"
  );

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const text = messageInput.value.trim();
    const role = roleInput.value;

    if (!text) return;

    if (
      PROJECT_ID.startsWith("REPLACE_ME") ||
      GRAPH_URL.startsWith("REPLACE_ME")
    ) {
      status.textContent = "Set PROJECT_ID and GRAPH_URL first.";
      return;
    }

    addMessage("user", text, role.toUpperCase());
    messageInput.value = "";
    sendButton.disabled = true;
    status.textContent = "The agents are reviewing the topic…";

    try {
      const response = await fetch(GRAPH_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          project_id: PROJECT_ID,
          role: role,
          text: text
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.detail || `Request failed: HTTP ${response.status}`
        );
      }

      const agentMessages = data.agent_messages || [];

      for (const message of agentMessages) {
        addMessage(
          "assistant",
          message.text,
          message.agent
        );
      }

      status.textContent = `Project status: ${data.validation_status}.`;
    } catch (error) {
      console.error(error);

      addMessage(
        "assistant",
        "The request did not complete. Check Render Logs.",
        "System"
      );

      status.textContent = error.message;
    } finally {
      sendButton.disabled = false;
      messageInput.focus();
    }
  });
</script>
