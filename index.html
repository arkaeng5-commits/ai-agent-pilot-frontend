<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Any-Topic AI Pilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Token system ─────────────────────────────────────────── */
    :root {
      --bg:          oklch(97% 0.005 250);
      --surface:     oklch(100% 0 0);
      --surface-2:   oklch(94% 0.008 250);
      --border:      oklch(88% 0.010 250);
      --text:        oklch(18% 0.015 250);
      --text-muted:  oklch(50% 0.015 250);
      --accent:      oklch(52% 0.18 250);
      --accent-fg:   oklch(99% 0 0);
      --accent-soft: oklch(94% 0.04 250);
      --user-bg:     oklch(52% 0.18 250);
      --user-fg:     oklch(99% 0 0);
      --bot-bg:      oklch(94% 0.008 250);
      --bot-fg:      oklch(18% 0.015 250);
      --warn-bg:     oklch(96% 0.06 80);
      --warn-border: oklch(78% 0.14 75);
      --warn-text:   oklch(38% 0.12 60);
      --radius-sm:   6px;
      --radius-md:   12px;
      --radius-lg:   18px;
      --shadow:      0 1px 3px oklch(0% 0 0 / .08), 0 4px 12px oklch(0% 0 0 / .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:          oklch(14% 0.010 250);
        --surface:     oklch(19% 0.012 250);
        --surface-2:   oklch(23% 0.012 250);
        --border:      oklch(30% 0.012 250);
        --text:        oklch(93% 0.008 250);
        --text-muted:  oklch(60% 0.010 250);
        --accent:      oklch(68% 0.16 250);
        --accent-fg:   oklch(10% 0 0);
        --accent-soft: oklch(25% 0.05 250);
        --user-bg:     oklch(62% 0.16 250);
        --user-fg:     oklch(10% 0 0);
        --bot-bg:      oklch(23% 0.012 250);
        --bot-fg:      oklch(93% 0.008 250);
        --warn-bg:     oklch(22% 0.05 75);
        --warn-border: oklch(55% 0.12 70);
        --warn-text:   oklch(80% 0.10 70);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Vazirmatn', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* ── App shell ────────────────────────────────────────────── */
    .app {
      width: min(760px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -.01em;
    }
    header p {
      font-size: .82rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* ── Message list ─────────────────────────────────────────── */
    #chat {
      flex: 1;
      height: 420px;
      overflow-y: auto;
      padding: 20px 20px 8px;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    .message { display: flex; flex-direction: column; max-width: 82%; gap: 4px; }
    .message.user   { align-self: flex-end; align-items: flex-end; }
    .message.assistant { align-self: flex-start; align-items: flex-start; }

    .msg-label {
      font-size: .72rem;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .04em;
      padding: 0 4px;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: .9rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.user     .bubble { background: var(--user-bg); color: var(--user-fg); border-bottom-right-radius: var(--radius-sm); }
    .message.assistant .bubble { background: var(--bot-bg);  color: var(--bot-fg);  border-bottom-left-radius: var(--radius-sm); }

    /* ── Conflict panel ───────────────────────────────────────── */
    #conflict-panel {
      display: none;
      margin: 0 20px;
      padding: 10px 14px;
      border: 1px solid var(--warn-border);
      border-radius: var(--radius-md);
      background: var(--warn-bg);
      color: var(--warn-text);
      font-size: .84rem;
      line-height: 1.5;
      gap: 8px;
      align-items: flex-start;
    }
    #conflict-panel.visible { display: flex; }
    #conflict-panel svg { flex-shrink: 0; margin-top: 2px; }
    #conflict-panel p { margin: 0; }

    /* ── Status bar ───────────────────────────────────────────── */
    #status-bar {
      padding: 6px 20px;
      font-size: .78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .03em;
    }
    .badge-pending  { background: var(--surface-2); color: var(--text-muted); }
    .badge-ok       { background: oklch(92% 0.08 155); color: oklch(32% 0.14 155); }
    .badge-conflict { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-border); }

    /* ── Form ─────────────────────────────────────────────────── */
    .form-wrap {
      padding: 12px 20px 20px;
      border-top: 1px solid var(--border);
    }
    form {
      display: grid;
      grid-template-columns: 148px 1fr auto;
      gap: 8px;
      align-items: end;
    }
    label { display: flex; flex-direction: column; gap: 4px; font-size: .78rem; color: var(--text-muted); font-weight: 500; }

    select, textarea {
      font-family: inherit;
      font-size: .88rem;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      outline: none;
      transition: border-color .15s;
      resize: none;
    }
    select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px oklch(52% 0.18 250 / .15);
    }

    textarea { min-height: 72px; max-height: 180px; overflow-y: auto; line-height: 1.5; }

    button[type="submit"] {
      font-family: inherit;
      font-size: .88rem;
      font-weight: 600;
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: var(--radius-sm);
      padding: 9px 20px;
      cursor: pointer;
      align-self: end;
      height: 40px;
      transition: opacity .15s, transform .1s;
    }
    button[type="submit"]:hover:not(:disabled) { opacity: .88; }
    button[type="submit"]:active:not(:disabled) { transform: scale(.97); }
    button[type="submit"]:disabled { opacity: .45; cursor: not-allowed; }
    button[type="submit"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── RTL support ──────────────────────────────────────────── */
    [dir="rtl"] { font-family: 'Vazirmatn', 'Inter', system-ui, sans-serif; }

    /* ── Responsive ───────────────────────────────────────────── */
    @media (max-width: 580px) {
      #chat { height: 340px; }
      form { grid-template-columns: 1fr; }
      button[type="submit"] { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
<div class="app" role="main">
  <header>
    <h1>Any-Topic AI Pilot</h1>
    <p>Finance, R&D, and CEO perspectives for any discussion.</p>
  </header>

  <section id="chat" aria-live="polite" aria-label="Conversation"></section>

  <div id="conflict-panel" role="alert" aria-live="assertive">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M8 1.5L14.5 13H1.5L8 1.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="8" y1="6.5" x2="8" y2="9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="8" cy="11.25" r=".75" fill="currentColor"/>
    </svg>
    <p id="conflict-text"></p>
  </div>

  <div id="status-bar">
    <span id="status-text"></span>
  </div>

  <div class="form-wrap">
    <form id="chat-form" novalidate>
      <label for="role-select">
        Role
        <select id="role-select" name="role" required>
          <option value="finance">Finance</option>
          <option value="rnd">R&amp;D</option>
          <option value="ceo">CEO</option>
        </select>
      </label>
      <label for="msg-input">
        Message
        <textarea
          id="msg-input"
          name="text"
          required
          placeholder="Describe an idea, problem, proposal, or decision…"
          rows="3"
          aria-label="Your message"
        ></textarea>
      </label>
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>
</div>

  const conflictText  = document.getElementById("conflict-text");

  msgInput.addEventListener("input", () => {
