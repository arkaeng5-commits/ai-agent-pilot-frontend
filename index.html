<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Section and CEO Project Pilot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3f6fb;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    .app {
      width: min(900px, calc(100% - 32px));
      margin: 32px auto;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #dce3ef;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(28, 39, 64, 0.10);
    }

    header {
      padding: 22px 24px;
      color: #ffffff;
      background: #172b4d;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    header p {
      margin: 0;
      color: #dce8ff;
    }

    .warning {
      padding: 10px 16px;
      color: #704600;
      background: #fff3cd;
      border-bottom: 1px solid #f0d58a;
      font-size: 13px;
    }

    .controls {
      padding: 16px;
      border-bottom: 1px solid #dce3ef;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 14px;
      font-weight: bold;
    }

    select,
    textarea,
    button {
      border-radius: 8px;
      font: inherit;
    }

    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #bfc9d8;
    }

    #chat {
      height: 430px;
      overflow-y: auto;
      padding: 20px;
      background: #fbfcff;
    }

    .message {
      max-width: 84%;
      margin: 10px 0;
      padding: 12px 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .message.employee,
    .message.ceo {
      margin-left: auto;
      color: #ffffff;
      background: #2667d9;
    }

    .message.assistant {
      background: #e9eef8;
    }

    .label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      font-weight: bold;
      opacity: 0.78;
    }

    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #dce3ef;
    }

    textarea {
      min-height: 52px;
      resize: vertical;
    }

    button {
      min-width: 100px;
      border: 0;
      color: #ffffff;
      background: #1d6f42;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    #status {
      min-height: 28px;
      padding: 0 16px 16px;
      color: #56627a;
      font-size: 14px;
    }

    @media (max-width: 620px) {
      form {
        grid-template-columns: 1fr;
      }

      button {
        min-height: 44px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>Section and CEO Project Pilot</h1>
      <p>Sections propose values. CEO decides official and secret values.</p>
    </header>

    <div class="warning">
      Testing mode: any person can select CEO. Add real login/access control later.
    </div>

    <section class="controls">
      <label>
        Your section
        <select id="section-tag">
          <option value="finance">Finance</option>
          <option value="rnd">R&amp;D</option>
          <option value="operations">Operations</option>
          <option value="marketing">Marketing</option>
          <option value="ceo">CEO</option>
        </select>
      </label>
    </section>

    <section id="chat" aria-live="polite"></section>

    <form id="chat-form">
      <textarea
        id="message"
        placeholder="Write a message for your section."
        required
      ></textarea>

      <button id="send-button" type="submit">Send</button>
    </form>

    <div id="status"></div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const PROJECT_ID = "57495c44-ee23-4be7-ade2-b70b6b4c8416";
      const GRAPH_URL = "https://ai-agent-pilot-backend.onrender.com/run_graph";
      const API_BASE_URL = GRAPH_URL.replace(/\/run_graph\/?$/, "");

      const sectionInput = document.getElementById("section-tag");
      const chat = document.getElementById("chat");
      const form = document.getElementById("chat-form");
      const messageInput = document.getElementById("message");
      const sendButton = document.getElementById("send-button");
      const status = document.getElementById("status");

      function sectionName(section) {
        return {
          finance: "Finance",
          rnd: "R&D",
          operations: "Operations",
          marketing: "Marketing",
          ceo: "CEO"
        }[section] || section;
      }

      function addMessage(type, text, label) {
        const box = document.createElement("article");
        box.className = `message ${type}`;

        const title = document.createElement("span");
        title.className = "label";
        title.textContent = label;

        const content = document.createElement("div");
        content.textContent = text;

        box.append(title, content);
        chat.appendChild(box);
        chat.scrollTop = chat.scrollHeight;
      }

      function clearChat() {
        chat.innerHTML = "";
      }

      async function loadSectionChat() {
        clearChat();

        const section = sectionInput.value;
        status.textContent = `Loading ${sectionName(section)} chat…`;

        try {
          const url =
            `${API_BASE_URL}/projects/${PROJECT_ID}/messages` +
            `?section_tag=${encodeURIComponent(section)}`;

          const response = await fetch(url);
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.detail || "Could not load chat.");
          }

          const messages = data.messages || [];

          if (messages.length === 0) {
            addMessage(
              "assistant",
              "No messages exist yet in this section.",
              "System"
            );
          }

          for (const message of messages) {
            const label =
              message.metadata?.label ||
              (message.actor_type === "assistant"
                ? "Assistant"
                : sectionName(message.section_tag));

            addMessage(
              message.actor_type,
              message.text,
              label
            );
          }

          status.textContent = `${sectionName(section)} chat loaded.`;
        } catch (error) {
          console.error(error);
          addMessage("assistant", error.message, "System");
          status.textContent = error.message;
        }
      }

      sectionInput.addEventListener("change", () => {
        messageInput.placeholder = sectionInput.value === "ceo"
          ? "Ask about proposals, or explicitly set, revise, or define a secret parameter."
          : "Write a message for your section.";

        loadSectionChat();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const text = messageInput.value.trim();
        const section = sectionInput.value;

        if (!text) {
          return;
        }

        addMessage(
          section === "ceo" ? "ceo" : "employee",
          text,
          sectionName(section)
        );

        messageInput.value = "";
        sendButton.disabled = true;
        status.textContent = "Processing message…";

        try {
          const response = await fetch(GRAPH_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              project_id: PROJECT_ID,
              section_tag: section,
              text: text
            })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(
              data.detail || `Request failed: HTTP ${response.status}`
            );
          }

          addMessage(
            "assistant",
            data.reply,
            section === "ceo"
              ? "CEO Assistant"
              : `${sectionName(section)} Assistant`
          );

          status.textContent = data.decisions_saved > 0
            ? `CEO decision saved: ${data.decisions_saved} parameter(s) updated.`
            : "Message saved.";
        } catch (error) {
          console.error(error);
          addMessage("assistant", error.message, "System");
          status.textContent = error.message;
        } finally {
          sendButton.disabled = false;
          messageInput.focus();
        }
      });

      loadSectionChat();
    });
  </script>
</body>
</html>
